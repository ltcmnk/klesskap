<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klesskap</title>
  <link rel="stylesheet" href="klesskap.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"DM Serif Display"', 'Georgia', 'serif'],
            ui:      ['"DM Sans"', 'system-ui', 'sans-serif'],
            mono:    ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            canvas:       '#F2F1EE',
            base:         '#F2F1EE',
            elevated:     '#FAFAF8',
            subtle:       '#EEECEA',
            inset:        '#EEECEA',
            ink:          '#1E1E1C',
            'ink-2':      '#4A4845',
            'ink-3':      '#8A8784',
            'ink-4':      '#B8B4B0',
            accent:       '#7C6E5C',
            'accent-h':   '#6A5E4E',
            'accent-s':   '#EFEDE8',
            'accent-btn': '#5C5046',
            border:       '#E2E0DC',
            'border-h':   '#D8D5D0',
            success:      '#3D6B4F',
            'success-s':  '#F1F7F4',
            danger:       '#C0392B',
            'danger-s':   '#FDF2F1',
            warning:      '#7A6C3E',
            'warning-s':  '#FDFAF1',
          },
          borderRadius: {
            sm: '3px', DEFAULT: '6px', md: '6px', lg: '10px', xl: '14px',
          },
        }
      }
    }
  </script>
</head>
<body class="bg-base text-ink antialiased">

  <!-- ===== LOGIN ===== -->
  <div id="screen-login">
    <div class="w-full max-w-sm">
      <!-- Dot grid background via inline style on body handled in JS -->
      <div class="card shadow-md" style="padding: 40px;">
        <!-- Logo -->
        <div class="flex items-center gap-3 mb-9">
          <div class="w-7 h-7 border border-accent flex items-center justify-center login-k-badge" style="border-radius:3px">
            <span class="t-display text-accent" style="font-size:14px">K</span>
          </div>
          <span class="t-display text-ink login-wordmark" style="font-size:22px;letter-spacing:0.07em">KLESSKAP</span>
        </div>

        <!-- Demo chips -->
        <div class="mb-6">
          <p class="t-caps text-ink-3 mb-3">Acesso rápido</p>
          <div class="flex flex-wrap gap-2">
            <button onclick="applyChipLogin('admin')" class="border border-border rounded-sm px-3 py-1.5 text-[12px] cursor-pointer hover:bg-accent-s hover:border-accent hover:text-accent transition-all bg-elevated text-ink-2">Admin — Ana Paula</button>
            <button onclick="applyChipLogin('estoque')" class="border border-border rounded-sm px-3 py-1.5 text-[12px] cursor-pointer hover:bg-accent-s hover:border-accent hover:text-accent transition-all bg-elevated text-ink-2">Terminal Estoque</button>
            <button onclick="applyChipLogin('vendas')" class="border border-border rounded-sm px-3 py-1.5 text-[12px] cursor-pointer hover:bg-accent-s hover:border-accent hover:text-accent transition-all bg-elevated text-ink-2">Terminal Vendas</button>
          </div>
        </div>

        <!-- Fields -->
        <div class="mb-4">
          <label class="input-label" for="login-email">E-mail</label>
          <input type="email" id="login-email" class="input" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="mb-5">
          <label class="input-label" for="login-senha">Senha</label>
          <input type="password" id="login-senha" class="input" placeholder="••••••••" autocomplete="current-password">
        </div>

        <!-- Error -->
        <div id="login-error" role="alert" class="hidden flex items-center gap-2 mb-4 p-3 rounded bg-danger-s border border-danger/20">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-danger flex-shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span class="text-danger text-[13px]">Credenciais inválidas. Tente novamente.</span>
        </div>

        <button onclick="handleLogin()" id="btn-login" class="btn btn-primary btn-full btn-lg">
          Entrar
        </button>

        <p class="text-[11px] text-ink-3 text-center mt-5">Klesskap v1.0 — Valkiria Inc.</p>
      </div>
    </div>
  </div>

  <!-- ===== APP SHELL ===== -->
  <div id="app-shell" class="hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-subtle border-r border-border">
      <!-- Logo zone (56px = header height) -->
      <div class="h-14 flex items-center gap-2.5 px-5 border-b border-border flex-shrink-0">
        <div class="w-6 h-6 border border-accent flex items-center justify-center" style="border-radius:2px">
          <span class="t-display text-accent" style="font-size:12px">K</span>
        </div>
        <span class="t-display text-ink" style="font-size:18px;letter-spacing:0.07em">KLESSKAP</span>
      </div>

      <!-- Nav items rendered by JS -->
      <nav id="sidebar-nav" class="flex-1 py-2"></nav>

      <!-- Footer -->
      <div class="mt-auto border-t border-border p-4 flex items-center gap-2.5 flex-shrink-0">
        <div class="w-8 h-8 rounded-full bg-accent-s flex items-center justify-center text-accent text-[12px] font-medium flex-shrink-0" id="sidebar-avatar"></div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-medium text-ink truncate" id="sidebar-user-name"></p>
          <p class="text-[11px] text-ink-3" id="sidebar-user-role"></p>
        </div>
        <button onclick="handleLogout()" class="btn-icon" aria-label="Sair">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main area -->
    <div id="main-content">

      <!-- Header -->
      <header id="main-header">
        <!-- Zone A: Identity -->
        <div class="header-zone-a">
          <div class="w-6 h-6 border border-accent flex items-center justify-center hidden md:flex" style="border-radius:2px">
            <span class="t-display text-accent" style="font-size:12px">K</span>
          </div>
          <span class="t-display text-ink hidden md:block" style="font-size:18px;letter-spacing:0.07em">KLESSKAP</span>
          <button class="btn-icon md:hidden ml-auto" aria-label="Menu" onclick="toggleSidebar()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>

        <!-- Zone B: Search -->
        <div class="header-zone-b">
          <div class="header-search-wrap">
            <svg class="header-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" class="header-search" placeholder="Buscar produto, SKU...">
          </div>
        </div>

        <!-- Zone C: Actions -->
        <div class="header-zone-c">
          <span class="t-caps text-ink-3 mr-3 hidden lg:block" id="header-date"></span>
          <button class="btn btn-primary btn-sm hidden sm:flex" onclick="navigateTo('screen-pdv')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nova venda
          </button>
          <button class="btn-icon relative" aria-label="Notificações" id="btn-bell">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-danger rounded-full border-2 border-canvas" id="bell-dot"></span>
          </button>
          <button class="btn-icon flex items-center gap-1.5 pl-2 pr-1" id="btn-avatar">
            <div class="w-7 h-7 rounded-full bg-accent-s flex items-center justify-center text-[11px] font-medium text-accent" id="avatar-initials"></div>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden sm:block text-ink-3"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </header>

      <!-- SCREENS -->
      <section id="screen-dashboard"    class="screen screen-body hidden"></section>
      <section id="screen-catalog"      class="screen screen-body hidden"></section>
      <section id="screen-product-form" class="screen screen-body hidden"></section>
      <section id="screen-stock-entry"  class="screen screen-body hidden"></section>
      <section id="screen-pdv"          class="screen screen-body hidden"></section>
      <section id="screen-payment"      class="screen screen-body hidden"></section>
      <section id="screen-reports"      class="screen screen-body hidden"></section>
      <section id="screen-promotions"   class="screen screen-body hidden"></section>
      <section id="screen-users"        class="screen screen-body hidden"></section>
    </div>
  </div>

  <!-- Sidebar overlay mobile -->
  <div id="sidebar-overlay" class="hidden fixed inset-0 z-10" style="background:rgba(28,24,20,0.3)" onclick="closeSidebar()"></div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <script src="klesskap.js"></script>
</body>
</html>
